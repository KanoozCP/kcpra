<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANOOZ Central Planning</title>
    <link rel="icon" type="image/png" href="https://kanooz.com/wp-content/uploads/2026/05/Kanooz-Logo-transparent-png-2048x556.png" />
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/clsx@2.1.0/dist/clsx.min.js"></script>
    <script src="https://unpkg.com/tailwind-merge@2.2.1/dist/bundle-client.umd.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; background-color: #FAFAFA; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { background-color: #EEF2FF; color: #4338CA; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
            Cell, PieChart, Pie 
        } = Recharts;

        // --- Constants & Types ---
        const Tab = {
            DASHBOARD: 'Dashboard',
            MANPOWER: 'Manpower Pool',
            PROJECTS: 'Projects',
            ASSIGNMENTS: 'Assignments',
            SHORTAGES: 'Shortages',
            REPORTS: 'Reports'
        };

        const STORAGE_KEY = 'kanooz_system_data';

        // --- Helper: cn (simplified for browser) ---
        function cn(...classes) {
            return classes.filter(Boolean).join(' ');
        }

        // --- Main App Component ---
        function App() {
            const [activeTab, setActiveTab] = useState(Tab.DASHBOARD);
            const [manpower, setManpower] = useState([]);
            const [projects, setProjects] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);

            // Load Data
            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        setManpower(parsed.manpower || []);
                        setProjects(parsed.projects || []);
                        setAssignments(parsed.assignments || []);
                    } catch (e) {
                        console.error("Failed to parse data", e);
                    }
                }
            }, []);

            // Save Data
            useEffect(() => {
                const data = { manpower, projects, assignments };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [manpower, projects, assignments]);

            const handleReset = () => {
                if (confirm('CRITICAL WARNING: This will permanently delete ALL data. Are you sure?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    setManpower([]);
                    setProjects([]);
                    setAssignments([]);
                    window.location.reload();
                }
            };

            const formatToExcelDate = (d) => {
                if (!d) return '--';
                const date = new Date(d);
                if (isNaN(date.getTime())) return d || '--';
                const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                return ("0" + date.getDate()).slice(-2) + "-" + months[date.getMonth()] + "-" + String(date.getFullYear()).slice(-2);
            };

            const handleExport = () => {
                const wb = XLSX.utils.book_new();
                
                // 1. Manpower Sheet
                const wsManpower = XLSX.utils.json_to_sheet(manpower.map(m => ({
                    'Name': m.name,
                    'Badge Number': m.badgeNo,
                    'Passport / Iqama': m.passportIqama || '',
                    'Craft': m.craft,
                    'Employment Type': m.employmentType,
                    'Joining Date': formatToExcelDate(m.joinDate),
                    'Contract End Date': formatToExcelDate(m.releaseDate),
                    'Vacation Start': formatToExcelDate(m.vacationStart),
                    'Vacation Finish': formatToExcelDate(m.vacationEnd)
                })));
                XLSX.utils.book_append_sheet(wb, wsManpower, "Manpower Pool");
                
                // 2. Projects Summary Sheet
                const wsProjects = XLSX.utils.json_to_sheet(projects.map(p => ({
                    Code: p.code,
                    Name: p.name,
                    Location: p.location,
                    'Start Date': formatToExcelDate(p.startDate),
                    'End Date': formatToExcelDate(p.endDate),
                    'Resources Req': p.requirements?.reduce((sum, r) => sum + r.qty, 0) || 0
                })));
                XLSX.utils.book_append_sheet(wb, wsProjects, "Projects Master");

                // 3. Detailed Requirements
                const flatReqs = projects.flatMap(p => 
                    (p.requirements || []).map(r => ({
                        'Project Name': p.name,
                        'Project Code': p.code,
                        'Craft': r.craft,
                        'Qty Required': r.qty,
                        'Start Date': formatToExcelDate(r.startDate || p.startDate),
                        'End Date': formatToExcelDate(r.endDate || p.endDate)
                    }))
                );
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flatReqs), "Demand Details");

                // 4. Gap Analysis
                const gapAnalysis = projects.flatMap(p => 
                    (p.requirements || []).map(req => {
                        const assigned = assignments.filter(a => a.projectId === p.id && a.craft === req.craft).length;
                        return {
                            'Project': p.name,
                            'Craft': req.craft,
                            'Required': req.qty,
                            'Assigned': assigned,
                            'Shortage': Math.max(0, req.qty - assigned),
                            'Start Date': formatToExcelDate(req.startDate || p.startDate),
                            'End Date': formatToExcelDate(req.endDate || p.endDate)
                        };
                    })
                );
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(gapAnalysis), "Gap Analysis");

                XLSX.writeFile(wb, `Kanooz_Master_Portable_${formatToExcelDate(new Date())}.xlsx`);
            };

            // Global stats for dashboard
            const stats = useMemo(() => {
                const totalGaps = projects.reduce((acc, p) => {
                    const projectGaps = (p.requirements || []).reduce((pAcc, req) => {
                        const assignedToReq = assignments.filter(a => 
                            a.projectId === p.id && a.craft === req.craft
                        ).length;
                        return pAcc + Math.max(0, req.qty - assignedToReq);
                    }, 0);
                    return acc + projectGaps;
                }, 0);

                return [
                    { label: 'Manpower Pool', value: manpower.length, icon: 'users', color: 'bg-blue-50 text-blue-600' },
                    { label: 'Active Projects', value: projects.length, icon: 'briefcase', color: 'bg-purple-50 text-purple-600' },
                    { label: 'Assignments', value: assignments.length, icon: 'calendar', color: 'bg-green-50 text-green-600' },
                    { label: 'Resource Gaps', value: totalGaps, icon: 'alert-triangle', color: 'bg-amber-50 text-amber-600' }
                ];
            }, [manpower, projects, assignments]);

            // Chart Data
            const demandData = useMemo(() => {
                const map = {};
                projects.forEach(p => {
                    (p.requirements || []).forEach(r => {
                        map[r.craft] = (map[r.craft] || 0) + r.qty;
                    });
                });
                return Object.entries(map)
                    .map(([name, value]) => ({ name, value }))
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 10);
            }, [projects]);

            const projectHealthData = useMemo(() => {
                return projects.map(p => {
                    const req = (p.requirements || []).reduce((s, r) => s + r.qty, 0);
                    const ass = assignments.filter(a => a.projectId === p.id).length;
                    return { name: p.name, Required: req, Assigned: ass };
                }).slice(0, 8);
            }, [projects, assignments]);

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <aside className={cn(
                        "bg-white border-r border-[#E5E5E5] flex flex-col shrink-0 transition-all duration-300 ease-in-out z-20",
                        isSidebarOpen ? "w-64" : "w-16"
                    )}>
                        <div className="h-16 border-b border-[#E5E5E5] flex items-center px-4 justify-between">
                            {isSidebarOpen && <span className="text-[10px] font-extrabold text-indigo-900 tracking-tighter uppercase">Kanooz Portal</span>}
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-1 hover:bg-gray-100 rounded text-gray-400">
                                <i data-lucide="menu" className="w-4 h-4"></i>
                            </button>
                        </div>
                        <nav className="flex-1 p-2 space-y-1 overflow-y-auto">
                            {Object.entries(Tab).map(([key, label]) => (
                                <button 
                                    key={key} 
                                    onClick={() => setActiveTab(label)} 
                                    className={cn(
                                        "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all group",
                                        activeTab === label ? "tab-active" : "text-[#666] hover:bg-gray-50"
                                    )}
                                >
                                    <div className="w-4 flex justify-center">
                                        <i data-lucide={key === 'DASHBOARD' ? 'bar-chart-3' : key === 'MANPOWER' ? 'users' : key === 'PROJECTS' ? 'briefcase' : key === 'ASSIGNMENTS' ? 'calendar' : key === 'SHORTAGES' ? 'alert-triangle' : 'file-text'} className="w-4 h-4 shrink-0"></i>
                                    </div>
                                    {isSidebarOpen && <span className="truncate">{label}</span>}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-100 flex flex-col items-center">
                             <button onClick={handleReset} className="p-2 text-gray-300 hover:text-red-500 rounded transition-colors" title="System Reset">
                                <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                             </button>
                        </div>
                    </aside>

                    {/* Main */}
                    <main className="flex-1 flex flex-col overflow-hidden bg-[#FAFAFA] relative">
                         {/* Watermark */}
                         <div className="absolute inset-0 pointer-events-none flex items-center justify-center opacity-[0.03] z-0">
                            <img src="https://lh3.googleusercontent.com/d/1oQr4RoR9ON5vK6U_oIN2hW0HdnpEloO8" alt="" className="w-1/2 max-w-xl grayscale" />
                         </div>

                        <header className="h-16 bg-white/80 backdrop-blur-md border-b border-[#E5E5E5] flex items-center justify-between px-6 shrink-0 z-20">
                            <div className="flex items-center gap-4">
                                <img src="https://kanooz.com/assets/images/logo.png" className="h-6" />
                                <div className="h-6 w-[1px] bg-gray-200" />
                                <div>
                                    <h1 className="text-xs font-bold text-indigo-900 leading-tight">Central Planning Portal</h1>
                                    <p className="text-[9px] text-gray-400 uppercase tracking-widest leading-none">{activeTab}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-[10px] text-gray-400 font-bold uppercase hidden md:block">{dayjs().format('dddd, D MMMM')}</span>
                                <button onClick={handleExport} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center gap-2">
                                    <i data-lucide="download" className="w-3 h-3"></i> Export Excel
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 z-10">
                            {activeTab === Tab.DASHBOARD && (
                                <div className="space-y-8 animate-fade-in">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {stats.map(s => (
                                            <div key={s.label} className="bg-white p-4 rounded-2xl border border-[#E5E5E5] shadow-sm flex items-center justify-between">
                                                <div>
                                                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-widest">{s.label}</p>
                                                    <p className="text-xl font-bold text-gray-800">{s.value}</p>
                                                </div>
                                                <div className={cn("w-10 h-10 rounded-xl flex items-center justify-center", s.color)}>
                                                    <i data-lucide={s.icon} className="w-5 h-5"></i>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="space-y-6">
                                        {/* Histogram 1: Project Allocation */}
                                        <div className="bg-white p-6 rounded-2xl border border-[#E5E5E5] shadow-sm">
                                            <h3 className="text-sm font-bold mb-6 text-gray-800">Project Resource Status</h3>
                                            <div className="h-[300px]">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <BarChart data={projectHealthData} barGap={8}>
                                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F0F0F0" />
                                                        <XAxis dataKey="name" fontSize={10} tickLine={false} axisLine={false} dy={10} />
                                                        <YAxis fontSize={10} tickLine={false} axisLine={false} />
                                                        <Tooltip contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)' }} />
                                                        <Bar dataKey="Required" fill="#E5E7EB" radius={[4, 4, 0, 0]} barSize={32} />
                                                        <Bar dataKey="Assigned" fill="#4F46E5" radius={[4, 4, 0, 0]} barSize={32} />
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>

                                        {/* Histogram 2: Demand by Craft (Vertical) */}
                                        <div className="bg-white p-6 rounded-2xl border border-[#E5E5E5] shadow-sm">
                                            <h3 className="text-sm font-bold mb-6 text-gray-800">Top Project Demand by Craft</h3>
                                            <div className="h-[400px]">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <BarChart data={demandData} layout="vertical" margin={{ left: 20, right: 40, top: 0, bottom: 0 }}>
                                                        <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#f0f0f0" />
                                                        <XAxis type="number" hide />
                                                        <YAxis dataKey="name" type="category" fontSize={10} tickLine={false} axisLine={false} width={150} className="font-bold text-gray-600" />
                                                        <Tooltip contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)' }} />
                                                        <Bar dataKey="value" name="Demand" fill="#8B5CF6" radius={[0, 4, 4, 0]} barSize={20} label={{ position: 'right', fontSize: 10, fontWeight: 'bold' }} />
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === Tab.MANPOWER && (
                                <div className="bg-white rounded-2xl border border-[#E5E5E5] overflow-hidden animate-fade-in shadow-sm">
                                    <div className="p-4 border-b border-gray-50 flex justify-between items-center bg-gray-50/30">
                                        <h3 className="text-sm font-bold uppercase tracking-widest text-indigo-900">Manpower Pool ({manpower.length})</h3>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead className="bg-[#F9FAFB] text-[10px] text-gray-400 uppercase font-bold tracking-widest border-b border-gray-100">
                                                <tr>
                                                    <th className="px-6 py-4">Worker Detail</th>
                                                    <th className="px-6 py-4">Badge</th>
                                                    <th className="px-6 py-4">Craft</th>
                                                    <th className="px-6 py-4 text-center">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-50 text-xs">
                                                {manpower.length === 0 ? (
                                                    <tr><td colSpan="4" className="px-6 py-16 text-center text-gray-400 italic">No workers in database</td></tr>
                                                ) : (
                                                    manpower.map(m => (
                                                        <tr key={m.id} className="hover:bg-gray-50/50 transition-colors">
                                                            <td className="px-6 py-4">
                                                                <div className="font-bold text-gray-800">{m.name}</div>
                                                                <div className="text-[10px] text-gray-400">{m.nationality} • {m.passportIqama}</div>
                                                            </td>
                                                            <td className="px-6 py-4 font-mono text-gray-500">{m.badgeNo}</td>
                                                            <td className="px-6 py-4">
                                                                <span className="bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md font-extrabold uppercase text-[9px]">{m.craft}</span>
                                                            </td>
                                                            <td className="px-6 py-4 text-center">
                                                                <span className="inline-block w-2 h-2 rounded-full bg-green-400"></span>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {[Tab.PROJECTS, Tab.ASSIGNMENTS, Tab.SHORTAGES].includes(activeTab) && (
                                <div className="flex flex-col items-center justify-center h-full text-gray-400 py-20 bg-white rounded-2xl border-2 border-dashed border-gray-100 animate-fade-in">
                                    <i data-lucide="shield-check" className="w-16 h-16 mb-4 opacity-10"></i>
                                    <p className="text-sm font-bold text-gray-600">Advanced Component Active</p>
                                    <p className="text-xs text-gray-400 max-w-xs text-center">Full interactivity for these modules is best experienced in the main production application.</p>
                                </div>
                            )}

                            {activeTab === Tab.REPORTS && (
                                <div className="bg-white p-12 rounded-2xl border border-[#E5E5E5] text-center max-w-2xl mx-auto shadow-sm animate-fade-in">
                                    <i data-lucide="file-text" className="w-16 h-16 text-indigo-100 mx-auto mb-6"></i>
                                    <h3 className="text-xl font-bold mb-2">Detailed Reports Export</h3>
                                    <p className="text-[#666] mb-8">Generate comprehensive Excel reports including manpower availability, project requirements gaps, and confirmed assignments from the current session.</p>
                                    <button 
                                        onClick={handleExport}
                                        className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-indigo-100 hover:shadow-indigo-200 transition-all inline-flex items-center gap-2"
                                    >
                                        <i data-lucide="download" className="w-5 h-5"></i>
                                        Download Excel Report
                                    </button>
                                </div>
                            )}
                        </div>
                        
                        <footer className="h-10 bg-white border-t border-[#E5E5E5] flex items-center justify-between px-8 text-[10px] text-gray-400 font-bold shrink-0 z-10 uppercase tracking-widest">
                            <div>© 2026 Kanooz Central Planning</div>
                            <div className="flex items-center gap-2">
                                <span className="bg-green-50 text-green-500 px-2 py-0.5 rounded-full text-[8px]">Session Active</span>
                            </div>
                        </footer>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Init Lucide after React render (using a small interval to ensure DOM is ready)
        setInterval(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 1000);
    </script>
</body>
</html>
