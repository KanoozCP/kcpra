<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KANOOZ Central Planning</title>
    <link rel="icon" type="image/png" href="https://kanooz.com/wp-content/uploads/2026/05/Kanooz-Logo-transparent-png-2048x556.png" />
    <script id="error-catcher">
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 24px; color: #9b2c2c; font-family: -apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, Helvetica, Arial, sans-serif; background: #fff5f5; border: 1px solid #feb2b2; margin: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.5;">' +
            '<h3 style="margin-top:0; font-size: 16px; font-weight: bold; color: #c53030; display: flex; align-items: center; gap: 8px;">🚨 Startup Error Detected</h3>' +
            '<p style="font-size: 13px; margin: 8px 0;"><b>Error:</b> ' + e.message + '</p>' +
            '<p style="font-size: 12px; margin: 8px 0; color: #4a5568;"><b>Source:</b> ' + e.filename + ':' + e.lineno + ':' + e.colno + '</p>' +
            '<pre style="font-size: 11px; background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #edf2f7; overflow-x: auto; max-height: 155px; color: #4a5568;">' + (e.error ? e.error.stack : 'No stack trace available') + '</pre>' +
            '<div style="margin-top: 16px; border-t: 1px solid #fed7d7; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">' +
              '<span style="font-size: 11px; color: #718096;">Need to reset your configurations?</span>' +
              '<button onclick="localStorage.removeItem(\'kanooz_custom_firebase_config\'); location.reload();" style="background: #3182ce; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; transition: background 0.2s;">Reset Custom Config</button>' +
            '</div>' +
          '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root) {
          var errorMsg = e.reason ? (e.reason.message || e.reason) : 'Unknown promise rejection';
          var stack = e.reason && e.reason.stack ? e.reason.stack : 'No stack trace available';
          root.innerHTML = '<div style="padding: 24px; color: #9b2c2c; font-family: -apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, Helvetica, Arial, sans-serif; background: #fff5f5; border: 1px solid #feb2b2; margin: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.5;">' +
            '<h3 style="margin-top:0; font-size: 16px; font-weight: bold; color: #c53030; display: flex; align-items: center; gap: 8px;">🚨 Startup Rejection Error</h3>' +
            '<p style="font-size: 13px; margin: 8px 0;"><b>Rejection message:</b> ' + errorMsg + '</p>' +
            '<pre style="font-size: 11px; background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #edf2f7; overflow-x: auto; max-height: 155px; color: #4a5568;">' + stack + '</pre>' +
            '<div style="margin-top: 16px; border-t: 1px solid #fed7d7; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">' +
              '<span style="font-size: 11px; color: #718096;">Need to reset your configurations?</span>' +
              '<button onclick="localStorage.removeItem(\'kanooz_custom_firebase_config\'); location.reload();" style="background: #3182ce; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; transition: background 0.2s;">Reset Custom Config</button>' +
            '</div>' +
          '</div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
